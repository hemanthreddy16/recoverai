services:
  # 1. FastAPI Backend Service
  - type: web
    name: resurge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./resurge.db
      - key: CORS_ORIGINS
        value: "*"

  # 2. Next.js Frontend Service
  - type: web
    name: resurge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        fromService:
          type: web
          name: resurge-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: resurge-backend
          property: host
